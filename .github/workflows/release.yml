name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches versionName
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$GITHUB_REF_NAME versionName=$VERSION_NAME"
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME"
            exit 1
          fi

      - name: Test and build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Package artifacts
        run: |
          mkdir -p dist
          APK="dist/ChargeSentinel-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" | awk '{print $1}' > "$APK.sha256"
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ChargeSentinel $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.apk dist/*.apk.sha256

          BODY=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          gh release edit "$GITHUB_REF_NAME" --notes "$BODY

          ---

          Install: adb install -r ChargeSentinel-$GITHUB_REF_NAME.apk
          The APK is signed with the standard Android debug key; sideload it, do not expect store updates."
