<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="360" viewBox="0 0 1280 360" role="img"
     aria-label="ChargeSentinel — stop charging at 80%, resume at 50%">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B8A5E" stop-opacity="0.60"/>
      <stop offset="0.55" stop-color="#1B8A5E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1B8A5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3DDC97" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#141C25" stroke-width="1"/>
    </pattern>
    <path id="trackArc" d="M 971.46 253.54 A 104 104 0 1 1 1118.54 253.54"
          fill="none" stroke="#1E2A36" stroke-width="13" stroke-linecap="round"/>
    <path id="progressArc" d="M 971.46 253.54 A 104 104 0 1 1 1147.73 163.74"
          fill="none" stroke="#3DDC97" stroke-width="13" stroke-linecap="round"/>
    <clipPath id="card">
      <rect x="0" y="0" width="1280" height="360" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- breathing green glow behind the gauge -->
  <ellipse cx="1050" cy="170" rx="330" ry="300" fill="url(#glow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- slow light sweep -->
  <rect x="-420" y="0" width="420" height="360" fill="url(#scan)">
    <animate attributeName="x" from="-420" to="1280" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- gauge -->
  <use xlink:href="#trackArc"/>
  <use xlink:href="#progressArc" stroke-dasharray="522.76 1200" stroke-dashoffset="522.76">
    <animate attributeName="stroke-dashoffset" from="522.76" to="0"
             dur="2.4s" begin="0.15s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.25 0.8 0.25 1"/>
  </use>

  <!-- limit tick -->
  <line x1="1141.3" y1="164.8" x2="1154.2" y2="162.7"
        stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <!-- charge spark travelling along the arc -->
  <g>
    <circle r="9" fill="#3DDC97" opacity="0.22">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#progressArc"/>
      </animateMotion>
    </circle>
    <circle r="3.5" fill="#9BF3CB">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#progressArc"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.06;0.45;0.94;1"
               dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- gauge labels -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <g transform="translate(1045 180)">
      <animateTransform attributeName="transform" type="scale" additive="sum"
                        values="1;1.035;1" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"
                        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <text x="0" y="16" fill="#E6EDF3" font-size="44" font-weight="700">80%</text>
    </g>
    <text x="1045" y="223" fill="#8B98A5" font-size="13">charge limit</text>
  </g>

  <!-- copy -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
      <text x="72" y="88" fill="#5AA082" font-size="14" font-weight="600" letter-spacing="3.2">ANDROID · ROOT · BATTERY CARE</text>
      <text x="72" y="172" fill="#E6EDF3" font-size="78" font-weight="700" letter-spacing="-1">ChargeSentinel</text>
      <text x="72" y="238" fill="#8B98A5" font-size="24">Stop charging at 80%. Resume at 50%.</text>
      <text x="72" y="276" fill="#74818F" font-size="24">Hysteresis-based charge limiting for Android, powered by sysfs.</text>
    </g>
  </g>

  <!-- bottom accent -->
  <rect y="357" width="1280" height="3" fill="#182630"/>
  <rect y="357" width="0" height="3" fill="#3DDC97">
    <animate attributeName="width" from="0" to="537" dur="2.6s" fill="freeze"/>
  </rect>
  </g>
</svg>
